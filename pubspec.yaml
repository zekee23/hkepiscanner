name: attendancehkepi
description: "A new Flutter project."

publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.31.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.7.0
  mobile_scanner: ^3.5.0
  permission_handler: ^11.0.1
  just_audio: ^0.9.36
  dropdown_button2: ^2.3.9
  google_fonts: ^6.1.0  # or latest version
  intl: ^0.19.0
  file_picker: ^6.1.1
  excel: ^2.1.0
  fl_chart: ^0.66.0
  provider: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
      
  assets: 
    - assets/logo.png
    - assets/logo2.png
    - assets/sound/beep-scan.mp3

